<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fredericton Airport — Climate Statistics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #1a2330;
    --paper: #f6f4ee;
    --line: #d8d2c4;
    --accent: #e8a23c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--paper);
    color: var(--ink);
  }
  header { padding: 28px 24px 18px; border-bottom: 2px solid var(--ink); }
  header h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.02em; }
  header p { margin: 6px 0 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem; color: #555; }
  header nav { margin-top: 10px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.8rem; }
  header nav a { color: var(--ink); }
  .station-tag {
    display: inline-block; margin-top: 10px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.75rem;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--ink); padding: 3px 10px; border-radius: 2px;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 24px; }
  .status {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85rem;
    color: #777; margin: 4px 0 18px; min-height: 1.2em;
  }
  .chart-card {
    background: #fff; border: 1px solid var(--line);
    border-radius: 4px; padding: 16px; margin-bottom: 20px;
  }
  .chart-card h2 {
    font-size: 1rem; margin: 0 0 12px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-transform: uppercase; letter-spacing: 0.08em; color: #555;
  }
</style>
</head>
<body>

<header>
  <h1>Climate Statistics</h1>
  <p>Daily climatological mean ± 1σ and 2σ · ±7-day window · 1951–2026</p>
  <span class="station-tag">Fredericton Airport · Stations 6157 / 48568</span>
  <nav><a href="weather.html">← Daily weather history</a></nav>
</header>

<main>
  <div class="status" id="status">Loading data…</div>

  <div class="chart-card">
    <h2>Daily max temp climatology (°C)</h2>
    <canvas id="maxChart" height="280"></canvas>
  </div>

  <div class="chart-card">
    <h2>Daily min temp climatology (°C)</h2>
    <canvas id="minChart" height="280"></canvas>
  </div>

  <div class="chart-card">
    <h2>Deviation from mean — max above / min below (°C)</h2>
    <canvas id="anomChart" height="240"></canvas>
  </div>
</main>

<script>
let maxChart  = null;
let minChart  = null;
let anomChart = null;

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_DAYS  = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const WINDOW = 7;

function buildDayKeys() {
  const keys = [];
  for (let m = 0; m < 12; m++)
    for (let d = 1; d <= MONTH_DAYS[m]; d++)
      keys.push(`${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  return keys;
}
const DAY_KEYS = buildDayKeys();

const X_TICKS = {
  autoSkip: false,
  maxRotation: 0,
  callback: (_, i) => DAY_KEYS[i]?.endsWith('-01')
    ? MONTH_NAMES[parseInt(DAY_KEYS[i]) - 1] : '',
};

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const header = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
  const dateIdx = header.findIndex(h => /date\/time|date$/i.test(h));
  const maxIdx  = header.findIndex(h => /max temp/i.test(h));
  const minIdx  = header.findIndex(h => /min temp/i.test(h));
  if (dateIdx === -1 || maxIdx === -1 || minIdx === -1) return [];
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.replace(/"/g,'').trim());
    if (cols.length < header.length) continue;
    const date = cols[dateIdx];
    const max  = parseFloat(cols[maxIdx]);
    const min  = parseFloat(cols[minIdx]);
    if (!date) continue;
    rows.push({ date, max: isFinite(max) ? max : null, min: isFinite(min) ? min : null });
  }
  return rows;
}

async function loadAll() {
  const years = Array.from({length: 2026 - 1951 + 1}, (_, i) => 1951 + i);
  document.getElementById('status').textContent = `Loading ${years.length} data files…`;
  const texts = await Promise.all(years.map(year => {
    const station = year < 2010 ? 6157 : 48568;
    return fetch(`data/weather-${station}-${year}.csv`)
      .then(r => r.ok ? r.text() : null).catch(() => null);
  }));
  const byMMDD = {};
  let loaded = 0;
  for (const text of texts) {
    if (!text) continue;
    loaded++;
    for (const row of parseCSV(text)) {
      const key = row.date.slice(5);
      if (!byMMDD[key]) byMMDD[key] = { max: [], min: [] };
      if (row.max !== null) byMMDD[key].max.push(row.max);
      if (row.min !== null) byMMDD[key].min.push(row.min);
    }
  }
  document.getElementById('status').textContent = `Loaded ${loaded} years of data.`;
  return byMMDD;
}

function stats(values) {
  if (!values || values.length < 2) return { mean: null, std: null };
  const n = values.length;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  const std  = Math.sqrt(values.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1));
  return { mean, std };
}

function windowedStats(byMMDD, variable) {
  const n = DAY_KEYS.length;
  return Array.from({length: n}, (_, i) => {
    const vals = [];
    for (let o = -WINDOW; o <= WINDOW; o++) {
      const idx = ((i + o) % n + n) % n;
      vals.push(...(byMMDD[DAY_KEYS[idx]]?.[variable] ?? []));
    }
    return stats(vals);
  });
}

function fmt(v) { return v !== null ? +v.toFixed(2) : null; }

function climatologyDatasets(statsList, rgb) {
  const means = statsList.map(({mean}) => fmt(mean));
  const u1 = statsList.map(({mean, std}) => fmt(mean !== null ? mean + std     : null));
  const l1 = statsList.map(({mean, std}) => fmt(mean !== null ? mean - std     : null));
  const u2 = statsList.map(({mean, std}) => fmt(mean !== null ? mean + 2 * std : null));
  const l2 = statsList.map(({mean, std}) => fmt(mean !== null ? mean - 2 * std : null));
  return [
    { label: '±2σ', data: u2, borderColor: 'transparent', backgroundColor: `rgba(${rgb},0.12)`, fill: '+1', pointRadius: 0, tension: 0.3 },
    { label: '_l2', data: l2, borderColor: 'transparent', backgroundColor: 'transparent',        fill: false, pointRadius: 0, tension: 0.3 },
    { label: '±1σ', data: u1, borderColor: 'transparent', backgroundColor: `rgba(${rgb},0.22)`, fill: '+1', pointRadius: 0, tension: 0.3 },
    { label: '_l1', data: l1, borderColor: 'transparent', backgroundColor: 'transparent',        fill: false, pointRadius: 0, tension: 0.3 },
    { label: 'Mean', data: means, borderColor: `rgba(${rgb},1)`, backgroundColor: 'transparent', fill: false, pointRadius: 0, tension: 0.3, borderWidth: 2 },
  ];
}

function makeChart(canvasId, datasets, yLabel) {
  return new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: DAY_KEYS, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { filter: item => !item.text.startsWith('_') } } },
      scales: { x: { ticks: X_TICKS }, y: { title: { display: true, text: yLabel } } }
    }
  });
}

function renderAll(byMMDD) {
  const maxStats = windowedStats(byMMDD, 'max');
  const minStats = windowedStats(byMMDD, 'min');

  // Max temp climatology
  if (maxChart) maxChart.destroy();
  maxChart = makeChart('maxChart', climatologyDatasets(maxStats, '192,83,62'), '°C');

  // Min temp climatology
  if (minChart) minChart.destroy();
  minChart = makeChart('minChart', climatologyDatasets(minStats, '47,111,143'), '°C');

  // Combined deviation chart: max σ above x-axis, min σ below
  const maxU2 = maxStats.map(({std}) => fmt(std !== null ? 2 * std : null));
  const maxU1 = maxStats.map(({std}) => fmt(std));
  const minL1 = minStats.map(({std}) => fmt(std !== null ? -std       : null));
  const minL2 = minStats.map(({std}) => fmt(std !== null ? -2 * std   : null));
  const zeros = maxStats.map(({mean}) => mean !== null ? 0 : null);

  if (anomChart) anomChart.destroy();
  anomChart = new Chart(document.getElementById('anomChart'), {
    type: 'line',
    data: {
      labels: DAY_KEYS,
      datasets: [
        // Above: max temp — outer strip (+1σ to +2σ) then inner (+0 to +1σ)
        { label: 'Max ±2σ', data: maxU2, borderColor: 'transparent', backgroundColor: 'rgba(192,83,62,0.12)', fill: '+1', pointRadius: 0, tension: 0.3 },
        { label: '_mu1',    data: maxU1, borderColor: 'transparent', backgroundColor: 'rgba(192,83,62,0.22)', fill: 'origin', pointRadius: 0, tension: 0.3 },
        // Below: min temp — inner (0 to -1σ) then outer strip (-1σ to -2σ)
        { label: '_ml1',    data: minL1, borderColor: 'transparent', backgroundColor: 'rgba(47,111,143,0.22)', fill: 'origin', pointRadius: 0, tension: 0.3 },
        { label: 'Min ±2σ', data: minL2, borderColor: 'transparent', backgroundColor: 'rgba(47,111,143,0.12)', fill: '-1',    pointRadius: 0, tension: 0.3 },
        // Zero line
        { label: 'Zero', data: zeros, borderColor: 'rgba(26,35,48,0.4)', backgroundColor: 'transparent', fill: false, pointRadius: 0, tension: 0, borderWidth: 1, borderDash: [4, 3] },
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { filter: item => !item.text.startsWith('_') } } },
      scales: { x: { ticks: X_TICKS }, y: { title: { display: true, text: '°C from mean' } } }
    }
  });
}

(async () => {
  const byMMDD = await loadAll();
  renderAll(byMMDD);
})();
</script>
</body>
</html>
